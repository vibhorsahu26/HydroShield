[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hydroshield-backend"
version = "0.1.0"
description = "Backend foundation for HydroShield dam-break and flood inundation modelling"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "numpy>=2.0,<3.0",
  "pandas>=2.0,<3.0",
  "pyproj>=3.6,<4.0",
  "scipy>=1.11,<2.0",
  "xarray>=2024.1,<2027.0",
  "rasterio>=1.3,<2.0",
  "geopandas>=1.0,<2.0",
  "shapely>=2.0,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "psycopg[binary]>=3.1,<4.0",
  "python-multipart>=0.0.9,<1.0",
  "Pillow>=10.0,<13.0",
]


[project.optional-dependencies]
earthengine = [
  "earthengine-api>=1.7.43,<2.0",
]
test = [
  "pytest>=8.0,<10.0",
  "httpx>=0.27,<1.0",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_default_fixture_loop_scope = "function"

[tool.setuptools.packages.find]
include = ["app*"]
