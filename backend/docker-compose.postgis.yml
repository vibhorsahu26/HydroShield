services:
  postgis:
    image: postgis/postgis:16-3.5
    container_name: hydroshield-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: hydroshield
      POSTGRES_USER: hydroshield
      POSTGRES_PASSWORD: hydroshield
    ports:
      - "5432:5432"
    volumes:
      - hydroshield_postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hydroshield -d hydroshield"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hydroshield_postgis_data:
