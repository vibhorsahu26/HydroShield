name: HydroShield Full Stack CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e './backend[test]'
      - run: python -m compileall -q backend/app
      - run: python -m pytest -q -W error
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: node scripts/source-contract-check.mjs
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  frontend-api-contract:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e './backend[test]'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/hydroshield-api.log 2>&1 &
          echo $! > /tmp/hydroshield-api.pid
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/v1/health && break
            sleep 1
          done
        working-directory: backend
      - run: node scripts/integration-check.mjs
        working-directory: frontend
        env:
          HYDROSHIELD_API_URL: http://127.0.0.1:8000/api/v1
      - if: always()
        run: cat /tmp/hydroshield-api.log || true
